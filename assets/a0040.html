<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your logo on the #TeamGermany coach</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;900&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<script type="importmap">

<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#E6EDF5;font-family:"Source Sans 3",Helvetica,Arial,sans-serif;color:#000}
#stage{position:absolute;inset:0}
#stage canvas{display:block;width:100%;height:100%;cursor:grab}
#stage canvas:active{cursor:grabbing}
.card{position:absolute;left:24px;right:24px;top:24px;background:#fff;border:1px solid #D9DEE3;border-radius:6px;box-shadow:0 4px 16px rgba(0,51,102,.10);padding:16px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.btn{font:inherit;font-size:22px;font-weight:700;padding:12px 20px;border-radius:4px;cursor:pointer;border:0;background:#003366;color:#fff;transition:background .16s cubic-bezier(.4,0,.2,1)}
.btn:hover{background:#00264D}
.btn.ghost{background:#fff;color:#003366;border:1.5px solid #003366}
.btn.ghost:hover{background:#EEF2F7}
.btn[hidden]{display:none}
input[type=text]{flex:1 1 220px;font:inherit;font-size:22px;padding:11px 14px;border:1px solid #D9DEE3;border-radius:4px;background:#F2F3F4;color:#000}
input[type=file]{display:none}
.seg{display:flex;border:1px solid #D9DEE3;border-radius:4px;overflow:hidden}
.seg button{font:inherit;font-size:20px;font-weight:600;padding:9px 16px;border:0;border-right:1px solid #D9DEE3;background:#fff;color:#003366;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:#003366;color:#fff}
.note{flex:1 1 100%;font-size:20px;color:#474747;line-height:1.35;margin:0}
.hint{position:absolute;right:24px;bottom:24px;font-size:20px;color:#003366;background:rgba(255,255,255,.85);padding:8px 14px;border-radius:4px}
.drop{position:absolute;inset:0;display:none;place-items:center;background:rgba(0,51,102,.18);border:4px dashed #003366;font-size:32px;font-weight:700;color:#003366}
.drop.on{display:grid}
</style>
</head>
<body>
<div id="stage"></div>
<div class="drop" id="drop">Drop your logo on the coach</div>
<div class="card">
  <button class="btn" id="up">Upload your logo</button>
  <button class="btn ghost" id="clear" hidden>Remove</button>
  <input type="file" id="file" accept="image/png,image/jpeg,image/webp,image/svg+xml,.svg">
  <input type="text" id="co" placeholder="Company name (optional)" autocomplete="organization">
  <div class="seg" role="group" aria-label="View">
    <button data-v="hero" aria-pressed="true">3/4</button>
    <button data-v="right">Right</button>
    <button data-v="left">Left</button>
    <button data-v="rear">Rear</button>
  </div>
  <button class="btn ghost" id="dl">Download image</button>
  <p class="note" id="note">Five sponsor spots, each on both sides of the coach. RM 5,000 per spot. Tick spots on the right to preview.</p>
</div>
<div class="hint">Drag to turn · scroll to zoom</div>

  const on=showsLogo(n);
  g.fillStyle=on?'#fff':'#2a2c30';rr(g,x,y,w,h,6);g.fill();
  if(on&&logo){fitImg(g,logo,x+16,y+16,w-32,h-(company?52:32));
    if(company){g.fillStyle=NAVY;g.font='600 18px "Source Sans 3"';g.textAlign='center';g.fillText(company,x+w/2,y+h-12,w-16);}}
  else if(on){g.save();g.setLineDash([10,8]);g.lineWidth=3;g.strokeStyle='#9fb3cc';rr(g,x+8,y+8,w-16,h-16,4);g.stroke();g.restore();
    g.fillStyle=NAVY;g.textAlign='center';g.font='700 28px "Source Sans 3"';g.fillText('Your logo',x+w/2,y+h/2+4);
    g.font='600 20px "Source Sans 3"';g.fillStyle='#474747';g.fillText('RM 5,000',x+w/2,y+h/2+32);}
  else{g.fillStyle='#9aa1aa';g.textAlign='center';g.font='700 26px "Source Sans 3"';g.fillText('Spot '+n,x+w/2,y+h/2);g.font='600 20px "Source Sans 3"';g.fillText('Available',x+w/2,y+h/2+28);}
  g.textAlign='left';
  g.fillStyle=on?NAVY:'#4a4f57';g.beginPath();g.arc(x+20,y+20,14,0,Math.PI*2);g.fill();
  g.fillStyle='#fff';g.font='700 18px "Source Sans 3"';g.textAlign='center';g.fillText(String(n),x+20,y+26);g.textAlign='left';
}
function drawSide(c,right){
  const g=c.getContext('2d'),U=x=>right?(x-X0)*PX:(X1-x)*PX,V=y=>(Y1-y)*PX,span=(a,b)=>[Math.min(U(a),U(b)),Math.abs(U(b)-U(a))];
  g.fillStyle=liveryGradient(g,U);g.fillRect(0,0,c.width,c.height);
  // pixel camouflage
  const R=rng(27),S=.2;
  for(let x=X0;x<X1;x+=S)for(let y=Y0;y<Y1;y+=S){const cx=x+S/2,cy=y+S/2,a=R(),b=R();
    if(inBand(cx,cy)||inTitle(cx,cy)||inRoundel(cx,cy)||cy>2.92)continue;
    if(a<pixelDensity(cx,cy)){g.fillStyle=cellColor(b);const [px,pw]=span(x,x+S);g.fillRect(px,V(y+S),pw,S*PX);}}
  g.fillStyle=INK;g.fillRect(0,V(.62),c.width,V(Y0)-V(.62));
  // roof edge + upper deck glazing
  const rg=g.createLinearGradient(U(X0),0,U(X1),0);[[0,RED],[.5,YELLOW],[1,RED]].forEach(([s,col])=>rg.addColorStop(s,col));
  g.fillStyle=INK;g.fillRect(0,V(4.0),c.width,V(2.92)-V(4.0));
  g.fillStyle=rg;g.fillRect(0,V(Y1),c.width,V(4.02)-V(Y1));
  let [wx,ww]=span(-6.55,6.2);glass(g,wx,V(3.94),ww,V(3.0)-V(3.94));
  g.fillStyle=INK;[-4.6,-3.4,-1.4,1.3,3.5].forEach(x=>{const [px]=span(x,x);g.fillRect(px-6,V(3.94),12,V(3.0)-V(3.94));});
  // front sweep
  g.fillStyle=YELLOW;g.beginPath();g.moveTo(U(4.9),V(2.98));g.quadraticCurveTo(U(6.0),V(2.9),U(6.7),V(2.6));g.lineTo(U(6.7),V(2.45));g.quadraticCurveTo(U(6.0),V(2.78),U(4.9),V(2.92));g.fill();
  // sponsor band
  g.fillStyle=INK;g.beginPath();g.moveTo(U(BAND.x0-.15),V(BAND.y0));g.lineTo(U(BAND.x1+.08),V(BAND.y0));g.lineTo(U(BAND.x1+.08),V(BAND.y1));g.lineTo(U(BAND.x0),V(BAND.y1));
  g.quadraticCurveTo(U(BAND.x0-.8),V(BAND.y1+.05),U(BAND.x0-1.3),V(BAND.y1+.42));g.quadraticCurveTo(U(BAND.x0-.6),V(1.8),U(BAND.x0-.15),V(BAND.y0));g.fill();
  const hdr=(t,i)=>{const [px,pw]=span(panelX(i),panelX(i)+PW);g.fillStyle='#fff';g.font='700 20px "Source Sans 3"';g.textAlign='left';g.fillText(t,px+4,V(2.13));};
  hdr('MAIN ORGANISER',0);hdr('SUPPORTED BY',1);hdr('SPONSORS',right?2:6);
  for(let i=0;i<7;i++){const [px,pw]=span(panelX(i),panelX(i)+PW),py=V(PANEL_Y1),ph=V(PANEL_Y0)-V(PANEL_Y1);
    if(i===0){g.fillStyle='#fff';rr(g,px,py,pw,ph,6);g.fill();if(ahk.naturalWidth)fitImg(g,ahk,px+12,py+20,pw-24,ph-40);}
    else if(i===1){g.fillStyle='#fff';rr(g,px,py,pw,ph,6);g.fill();
      [['#000',0],['#DD0000',1],['#FFCE00',2]].forEach(([col,k])=>{g.fillStyle=col;g.fillRect(px+14,py+30+k*22,8,22);});
      g.fillStyle='#000';g.font='700 19px "Source Sans 3"';['Embassy','of the Federal','Republic of Germany','Kuala Lumpur'].forEach((t,k)=>{g.font=(k===0?'700 ':'400 ')+'17px "Source Sans 3"';g.fillText(t,px+30,py+44+k*22,pw-38);});}
    else spot(g,i-1,px,py,pw,ph);}
  // title
  g.fillStyle='#fff';g.textAlign=right?'right':'left';const tx=U(BAND.x1);
  g.font='900 100px "Source Sans 3"';g.fillText('#TeamGermany',tx,V(2.53),U(BAND.x1)>U(-.4)?U(BAND.x1)-U(-.4):U(-.4)-U(BAND.x1));
  g.font='600 22px "Source Sans 3"';g.fillText('Team Germany · Driving Partnerships Across Malaysia',tx,V(2.36));g.textAlign='left';
  // roundel
  const cx=U(RDL.x),cy=V(RDL.y),r=RDL.r*PX;
  g.fillStyle=INK;g.beginPath();g.arc(cx,cy,r,0,7);g.fill();g.fillStyle='#fff';g.beginPath();g.arc(cx,cy,r-14,0,7);g.fill();
  const dg=g.createLinearGradient(cx-r,cy-r,cx+r,cy+r);dg.addColorStop(0,'#F0301F');dg.addColorStop(1,'#B5121B');g.fillStyle=dg;g.beginPath();g.arc(cx,cy,r-30,0,7);g.fill();
  g.fillStyle='#fff';g.textAlign='center';g.font='700 46px "Source Serif 4"';g.fillText('#TeamGermany',cx,cy+4);
  g.font='900 52px "Source Sans 3"';g.fillStyle=YELLOW;g.fillText('2027',cx,cy+62);g.textAlign='left';
  [-2.97,-1.45,4.1].forEach(()=>{});
}
function drawRear(c){
  const g=c.getContext('2d'),w=c.width,h=c.height;
  const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,RED);gr.addColorStop(1,'#B5121B');g.fillStyle=gr;g.fillRect(0,0,w,h);
  const R=rng(9);for(let x=0;x<w;x+=40)for(let y=h*.5;y<h;y+=40){if(R()<.3){g.fillStyle=cellColor(R());g.fillRect(x,y,40,40);}}
  g.fillStyle=INK;g.fillRect(0,20,w,180);glass(g,30,30,w-60,160);
  g.fillStyle=INK;g.fillRect(40,250,w-80,170);
  g.fillStyle='#fff';g.textAlign='center';g.font='900 52px "Source Sans 3"';g.fillText('#TeamGermany',w/2,346,w-100);
  g.font='600 20px "Source Sans 3"';g.fillText('Driving Partnerships Across Malaysia',w/2,400,w-100);g.textAlign='left';
  g.fillStyle='#fff';rr(g,w/2-150,460,300,84,6);g.fill();if(ahk.naturalWidth)fitImg(g,ahk,w/2-136,470,272,64);
  g.fillStyle='#FFE9A8';rr(g,10,440,30,180,5);g.fill();rr(g,w-40,440,30,180,5);g.fill();
  g.fillStyle=INK;g.fillRect(0,h-40,w,40);
}
function drawFront(c){
  const g=c.getContext('2d'),w=c.width,h=c.height;g.fillStyle=INK;g.fillRect(0,0,w,h);
  g.fillStyle='#07090c';g.fillRect(40,16,w-80,44);g.fillStyle='#FFB020';g.font='700 28px "Source Sans 3"';g.textAlign='center';g.fillText('#TeamGermany',w/2,48);g.textAlign='left';
  glass(g,14,70,w-28,250);
  g.fillStyle=RED;g.fillRect(0,330,w,60);g.fillStyle=YELLOW;g.beginPath();g.moveTo(0,382);g.quadraticCurveTo(w/2,330,w,382);g.lineTo(w,392);g.quadraticCurveTo(w/2,342,0,392);g.fill();
  glass(g,14,398,w-28,h-410);g.fillStyle=INK;g.fillRect(w/2-4,398,8,h-410);

function drawGrille(c){
  const g=c.getContext('2d'),w=c.width,h=c.height;g.fillStyle=INK;g.fillRect(0,0,w,h);
  g.fillStyle='#EAF2FA';rr(g,18,30,120,30,12);g.fill();rr(g,w-138,30,120,30,12);g.fill();
  g.fillStyle=YELLOW;g.fillRect(22,70,80,6);g.fillRect(w-102,70,80,6);
  g.fillStyle='#1b1d21';rr(g,160,24,w-320,70,8);g.fill();g.strokeStyle='#2c3036';g.lineWidth=3;for(let y=38;y<90;y+=13){g.beginPath();g.moveTo(176,y);g.lineTo(w-176,y);g.stroke();}
  g.fillStyle=RED;g.fillRect(0,h-36,w,10);

function tex(c,rx=1,ry=1,ox=0,oy=0){const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;t.repeat.set(rx,ry);t.offset.set(ox,oy);return t;}
const FH=2.5, GH=0.95;
const cR=canvas(L*PX,H*PX),cL=canvas(L*PX,H*PX),cB=canvas(W*PX,3.5*PX),cF=canvas(W*PX,FH*PX),cG=canvas(W*PX,GH*PX);
const tR=tex(cR,1/L,1/H,-X0/L,-Y0/H),tL=tex(cL,1/L,1/H,-X0/L,-Y0/H),tB=tex(cB),tF=tex(cF),tG=tex(cG);

/* ---------- Double-deck coach body ---------- */
function profile(sx){
  const s=new THREE.Shape(),P=(x,y)=>[x*sx,y],yb=Y0,d=Math.sqrt(AR*AR-(AY-yb)**2),a=Math.asin((yb-AY)/AR);
  s.moveTo(...P(X0+.08,yb));
  AXLES.forEach(ax=>{s.lineTo(...P(ax-d,yb));if(sx>0)s.absarc(ax,AY,AR,Math.PI-a,a,true);else s.absarc(-ax,AY,AR,a,Math.PI-a,false);});
  s.lineTo(...P(X1-.08,yb));s.quadraticCurveTo(...P(X1,yb),...P(X1,yb+.12));
  s.lineTo(...P(X1,1.3));s.lineTo(...P(X1-.18,3.75));
  s.quadraticCurveTo(...P(X1-.3,Y1),...P(X1-.75,Y1));
  s.lineTo(...P(X0+.4,Y1));s.quadraticCurveTo(...P(X0,Y1),...P(X0,Y1-.4));
  s.lineTo(...P(X0,yb+.12));s.quadraticCurveTo(...P(X0,yb),...P(X0+.08,yb));
  return s;
}
const BEV=0.07;
const bodyGeo=new THREE.ExtrudeGeometry(profile(1),{depth:W-2*BEV,bevelEnabled:true,bevelThickness:BEV,bevelSize:BEV,bevelSegments:4,curveSegments:24});
bodyGeo.translate(0,0,-(W-2*BEV)/2);
const shell=new THREE.MeshPhysicalMaterial({color:RED,roughness:.3,metalness:.2,clearcoat:1,clearcoatRoughness:.12});
const bus=new THREE.Group();
const body=new THREE.Mesh(bodyGeo,shell);body.castShadow=true;bus.add(body);
bodyGeo.computeBoundingBox();const ZS=bodyGeo.boundingBox.max.z+0.003;
const skin=map=>new THREE.MeshPhysicalMaterial({map,roughness:.32,metalness:.15,clearcoat:1,clearcoatRoughness:.12,polygonOffset:true,polygonOffsetFactor:-1});
const sideR=new THREE.Mesh(new THREE.ShapeGeometry(profile(1),24),skin(tR));sideR.position.z=ZS;bus.add(sideR);
const sideL=new THREE.Mesh(new THREE.ShapeGeometry(profile(-1),24),skin(tL));sideL.rotation.y=Math.PI;sideL.position.z=-ZS;bus.add(sideL);
const rear=new THREE.Mesh(new THREE.PlaneGeometry(W-.16,3.5),skin(tB));rear.rotation.y=-Math.PI/2;rear.position.set(X0-BEV-.004,Y0+.12+1.75,0);bus.add(rear);
const grille=new THREE.Mesh(new THREE.PlaneGeometry(W-.16,GH),skin(tG));grille.rotation.y=Math.PI/2;grille.position.set(X1+BEV+.004,Y0+.0+GH/2,0);bus.add(grille);
const tilt=Math.atan2(.18,2.45);
const front=new THREE.Mesh(new THREE.PlaneGeometry(W-.16,FH),new THREE.MeshPhysicalMaterial({map:tF,roughness:.12,metalness:.3,clearcoat:1,polygonOffset:true,polygonOffsetFactor:-1}));
front.rotation.order='YXZ';front.rotation.set(-tilt,Math.PI/2,0);front.position.set(X1-.09+BEV+.006,1.3+1.225,0);bus.add(front);
const dark=new THREE.MeshStandardMaterial({color:'#121417',roughness:.7});
AXLES.forEach(ax=>{const well=new THREE.Mesh(new THREE.BoxGeometry(AR*2.05,AR*1.2,W-.7),dark);well.position.set(ax,AY+.15,0);bus.add(well);});
const tyre=new THREE.MeshStandardMaterial({color:'#141518',roughness:.85}),rim=new THREE.MeshStandardMaterial({color:'#c4c9cf',metalness:.85,roughness:.28});
AXLES.forEach(x=>[1,-1].forEach(s=>{
  const t=new THREE.Mesh(new THREE.CylinderGeometry(WR,WR,.34,40),tyre);t.rotation.x=Math.PI/2;t.position.set(x,WR,s*(W/2-.24));t.castShadow=true;bus.add(t);
  const r=new THREE.Mesh(new THREE.CylinderGeometry(.33,.33,.04,32),rim);r.rotation.x=Math.PI/2;r.position.set(x,WR,s*(W/2-.06));bus.add(r);
  const c=new THREE.Mesh(new THREE.CylinderGeometry(.1,.1,.06,20),dark);c.rotation.x=Math.PI/2;c.position.set(x,WR,s*(W/2-.03));bus.add(c);}));
const armMat=new THREE.MeshPhysicalMaterial({color:YELLOW,roughness:.3,clearcoat:1});
[1,-1].forEach(s=>{
  const arm=new THREE.Mesh(new THREE.TorusGeometry(.55,.04,8,24,Math.PI*.55),armMat);arm.position.set(X1-.35,2.95,s*(W/2-.05));arm.rotation.set(0,s>0?0:Math.PI,0);arm.rotateZ(-.1);
  const head=new THREE.Mesh(new THREE.BoxGeometry(.1,.45,.24),new THREE.MeshPhysicalMaterial({color:INK,roughness:.3,clearcoat:1}));head.position.set(X1+.22,2.62,s*(W/2+.2));head.castShadow=true;bus.add(arm,head);});
const bump=new THREE.Mesh(new THREE.BoxGeometry(.12,.22,W-.1),dark);bump.position.set(X1+BEV+.02,Y0+.12,0);bus.add(bump);
const bumpR=bump.clone();bumpR.position.x=X0-BEV-.02;bus.add(bumpR);
scene.add(bus);

function redraw(){drawSide(cR,true);drawSide(cL,false);drawRear(cB);drawFront(cF);drawGrille(cG);[tR,tL,tB,tF,tG].forEach(t=>t.needsUpdate=true);}
redraw();ahk.onload=redraw;
Promise.all(['900 100px "Source Sans 3"','700 28px "Source Sans 3"','700 46px "Source Serif 4"'].map(f=>document.fonts.load(f))).then(redraw);

/* ---------- Camera ---------- */
const VIEWS={hero:[14,6,17],right:[0,2.4,28],left:[0,2.4,-28],rear:[-19,2.8,0.01]};
let tween=null;
function go(v){tween={to:new THREE.Vector3(...VIEWS[v]),t0:performance.now(),from:camera.position.clone()};controls.autoRotate=false;
  document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v));}
document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.v)));
camera.position.set(...VIEWS.hero);
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;
  camera.setViewOffset(w,h,0,-($('.card').offsetHeight+24)*0.5,w,h);camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(stage);resize();
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;if(reduce)controls.autoRotate=false;
renderer.setAnimationLoop(now=>{
  if(tween){const k=Math.min(1,(now-tween.t0)/(reduce?1:800)),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    const sa=new THREE.Spherical().setFromVector3(tween.from.clone().sub(controls.target)),sb=new THREE.Spherical().setFromVector3(tween.to.clone().sub(controls.target));
    let dt=sb.theta-sa.theta;if(dt>Math.PI)dt-=2*Math.PI;if(dt<-Math.PI)dt+=2*Math.PI;
    camera.position.setFromSpherical(new THREE.Spherical(sa.radius+(sb.radius-sa.radius)*e,sa.phi+(sb.phi-sa.phi)*e,sa.theta+dt*e)).add(controls.target);
    if(k>=1)tween=null;}
  controls.update();renderer.render(scene,camera);});

/* ---------- Parent link ---------- */
addEventListener('message',e=>{const d=e.data||{};
  if(d.busSpots){picked=d.busSpots;redraw();}
  if(d.busFocus)go(camera.position.z>=0?'right':'left');});
if(parent!==window)parent.postMessage({busReady:true},'*');

/* ---------- Upload ---------- */
const note=$('#note'),file=$('#file'),DEF=note.textContent;
function readFile(f){
  if(!f)return;
  if(!/^image\/(png|jpe?g|webp|svg\+xml)$/.test(f.type)&&!/\.svg$/i.test(f.name)){note.textContent='Use a PNG, JPG, WebP or SVG file.';return;}
  const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{logo=img;$('#clear').hidden=false;
    note.textContent=anyPicked()?'Shown on the spots you ticked, on both sides. Turn the coach to check.':'Previewed on all five spots. Tick spots on the right to narrow it down.';redraw();};
    img.onerror=()=>{note.textContent='That file could not be opened. Try exporting it again.';};img.src=fr.result;};
  fr.readAsDataURL(f);
}
$('#up').onclick=()=>file.click();
file.onchange=()=>{readFile(file.files[0]);file.value='';};
$('#clear').onclick=()=>{logo=null;$('#clear').hidden=true;note.textContent=DEF;redraw();};
$('#co').addEventListener('input',e=>{company=e.target.value.trim();redraw();});
$('#co').addEventListener('keydown',e=>e.stopPropagation());
$('#dl').onclick=()=>{renderer.render(scene,camera);const a=document.createElement('a');a.href=renderer.domElement.toDataURL('image/png');a.download='teamgermany-coach-mockup.png';a.click();};
const drop=$('#drop');
addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('on');});
addEventListener('dragleave',e=>{if(e.target===drop)drop.classList.remove('on');});
addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('on');readFile(e.dataTransfer.files[0]);});
</script>
