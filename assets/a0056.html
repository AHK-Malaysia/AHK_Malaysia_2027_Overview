<script type="module">
/* Modelled on the MGCC office walk-through videos (Meeting Room 1, 2, 3 and Reception, Oct 2026). */
const q=new URLSearchParams((location.search||location.hash.replace(/^#/,"?")));
const scene=q.get('scene')||'meeting';
const ROOM=+(q.get('room')||1);
const stage=document.querySelector('three-d-stage');
if(q.has('embed')) stage.setAttribute('notoolbar','');
stage.setAttribute('name', scene==='reception'?'ahk-reception':(ROOM===4?'ahk-boardroom':'ahk-meeting-room-'+ROOM));
const TAGS={reception:['Chamber reception','Digital screen on the member logo wall'],1:['Meeting Room 1','4 seats · wall TV and display shelves'],2:['Meeting Room 2','10 seats'],4:['Boardroom','Board table for about 20 · flags and member photo wall'],3:['Meeting Room 3','4 seats · TV on stand']};
{const t=scene==='reception'?TAGS.reception:(TAGS[ROOM]||TAGS[1]);document.getElementById('tag').innerHTML=t[0]+'<span>'+t[1]+'</span>';}
const { THREE } = await stage.ready;
try{ await document.fonts.load('900 80px "Source Sans 3"'); await document.fonts.load('700 40px "Source Sans 3"'); await document.fonts.load('400 40px "Source Sans 3"'); }catch(e){}

const NAVY='#003366', YEL='#FFDE5B';
const mat=(name,color,o={})=>{const m=new THREE.MeshStandardMaterial({color,roughness:o.r??.8,metalness:o.m??0,...(o.x||{})});m.name=name;return m;};
const M={
  wall:mat('wall_cream','#F1EEE6',{r:.95}),
  white:mat('furniture_white','#FBFBFA',{r:.4}),
  metal:mat('metal','#A3A8AD',{r:.35,m:.4}),
  black:mat('black','#16191D',{r:.45}),
  brand:mat('brand_yellow',YEL,{r:.6}),
  navy:mat('ahk_navy',NAVY,{r:.6}),
  glass:mat('glass','#DCEBF0',{r:.05,x:{transparent:true,opacity:.22,depthWrite:false}}),
  wb:mat('glass_whiteboard','#CFE6DF',{r:.1}),
  felt:mat('pinboard_felt','#6F80BF',{r:1}),
  walnut:mat('table_walnut','#9B4E2A',{r:.42}),
  tableEdge:mat('table_edge','#6A3218',{r:.5}),
  frame:mat('chair_frame','#8D9297',{r:.35,m:.45}),
  lime:mat('chair_green','#A8BF66',{r:.85}),
  arm:mat('chair_arm','#202328',{r:.6}),
  seat:mat('chair_seat','#D8D2C2',{r:.95}),
  doorWood:mat('door_wood','#A05F2C',{r:.5}),
  partWhite:mat('partition_white','#F4F4F2',{r:.3}),
  partBlue:mat('partition_blue','#3E7DB4',{r:.6}),
};

function tex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');draw(x,w,h);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t;}
const texMat=(name,t,r=.8,o={})=>{const m=new THREE.MeshStandardMaterial({map:t,roughness:r,...o});m.name=name;return m;};
const screenMat=(name,t,i=.8)=>{const m=new THREE.MeshStandardMaterial({map:t,emissive:'#ffffff',emissiveMap:t,emissiveIntensity:i,roughness:.3});m.name=name;return m;};
function fitText(x,txt,max,weight,size){let s=size;do{x.font=`${weight} ${s}px "Source Sans 3",sans-serif`;s-=2;}while(x.measureText(txt).width>max&&s>8);}

const G=new THREE.Group();
function box(name,w,h,d,m,x,y,z,ry=0){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.name=name;o.position.set(x,y,z);o.rotation.y=ry;G.add(o);return o;}
function cyl(name,rt,rb,h,m,x,y,z,seg=32){const o=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),m);o.name=name;o.position.set(x,y,z);G.add(o);return o;}
function plane(name,w,h,m,x,y,z,ry=0){const o=new THREE.Mesh(new THREE.PlaneGeometry(w,h),m);o.name=name;o.position.set(x,y,z);o.rotation.y=ry;G.add(o);return o;}

/* --- shared textures --- */
function brandScreen(w,h,title,sub){return tex(w,h,(x,W,H)=>{
  const g=x.createLinearGradient(0,0,W,0);g.addColorStop(0,NAVY);g.addColorStop(1,'#0A4A8A');x.fillStyle=g;x.fillRect(0,0,W,H);
  x.fillStyle=YEL;x.fillRect(0,H*.82,W,H*.18);
  x.fillStyle='#fff';x.textBaseline='middle';x.textAlign='center';
