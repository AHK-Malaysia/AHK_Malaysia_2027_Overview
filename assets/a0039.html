<script type="module">
const q=new URLSearchParams((location.search||location.hash.replace(/^#/,"?")));
const stage=document.querySelector('three-d-stage');
if(q.has('embed')) stage.setAttribute('notoolbar','');
const { THREE } = await stage.ready;
try{ await document.fonts.load('900 80px "Source Sans 3"'); await document.fonts.load('700 40px "Source Sans 3"'); }catch(e){}

const NAVY='#003366', YEL='#FFDE5B', LB='#CCD7E6';
let seed=11; const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const mat=(name,color,o={})=>{const m=new THREE.MeshStandardMaterial({color,roughness:o.r??.8,metalness:o.m??0,...(o.x||{})});m.name=name;return m;};
const M={
  carpet:mat('carpet','#3B4356',{r:1}),
  wall:mat('wall','#F4F4F1',{r:.95}),
  cloth:mat('table_cloth','#FAFAF8',{r:.9}),
  navy:mat('ahk_navy',NAVY,{r:.55}),
  light:mat('ahk_light_blue',LB,{r:.8}),
  stageTop:mat('stage_top','#FDFDFC',{r:.35}),
  chair:mat('chair_cover','#E9ECF1',{r:.9}),
  sash:mat('chair_sash',NAVY,{r:.7}),
  metal:mat('metal','#A9AEB4',{r:.35,m:.4}),
  boothWall:mat('booth_wall','#FBFBFA',{r:.6}),
  boothFloor:mat('booth_floor','#D7DCE2',{r:.7}),
  halo:mat('halo_light','#ffffff',{r:.3,x:{emissive:'#ffffff',emissiveIntensity:1.6}}),
  led:mat('led_strip','#9FD8F2',{r:.3,x:{emissive:'#7FD0F5',emissiveIntensity:1.2}}),
  flower:mat('centrepiece',YEL,{r:.8}),
};
const SUITS=['#1F2A3D','#34383E','#6F757D','#E7E6E1','#22324A','#6E2E35','#B9A58A'].map((c,i)=>mat('clothing_'+i,c,{r:.85}));
const SKIN=['#E3BC98','#C08F68','#8A6246','#F0CBAA'].map((c,i)=>mat('skin_'+i,c,{r:.7}));
const HAIR=mat('hair','#2A2420',{r:.9});

function tex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');draw(x,w,h);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t;}
const texMat=(name,t,o={})=>{const m=new THREE.MeshStandardMaterial({map:t,roughness:o.r??.7,...(o.glow?{emissive:'#fff',emissiveMap:t,emissiveIntensity:o.glow}:{})});m.name=name;return m;};
const font=(w,s)=>`${w} ${s}px "Source Sans 3",sans-serif`;

const G=new THREE.Group(); G.name='agm_hall';
function mesh(name,geo,m,x,y,z,parent=G){const o=new THREE.Mesh(geo,m);o.name=name;o.position.set(x,y,z);parent.add(o);return o;}
const box=(n,w,h,d,m,x,y,z,p)=>mesh(n,new THREE.BoxGeometry(w,h,d),m,x,y,z,p);
const cyl=(n,rt,rb,h,m,x,y,z,seg=32,p)=>mesh(n,new THREE.CylinderGeometry(rt,rb,h,seg),m,x,y,z,p);
const plane=(n,w,h,m,x,y,z,p)=>mesh(n,new THREE.PlaneGeometry(w,h),m,x,y,z,p);

// hall shell (cut-away: back + left walls)
const HW=36, Z0=-17, Z1=14;
box('floor',HW,.05,Z1-Z0,M.carpet,0,.025,(Z0+Z1)/2);
box('wall_back',HW,7,.2,M.wall,0,3.5,Z0-.1);

// theatre seating in the round, merged per material
function mergeByMaterial(root,prefix){
  root.updateMatrixWorld(true);const bk=new Map();
  root.traverse(o=>{if(!o.isMesh)return;const g=(o.geometry.index?o.geometry.toNonIndexed():o.geometry.clone());g.applyMatrix4(o.matrixWorld);if(!bk.has(o.material))bk.set(o.material,[]);bk.get(o.material).push(g);});
  const out=new THREE.Group();out.name=prefix;
  for(const [m,gs] of bk){let n=0;for(const g of gs)n+=g.attributes.position.count;
    const P=new Float32Array(n*3),N=new Float32Array(n*3),U=new Float32Array(n*2);let o=0;
    for(const g of gs){P.set(g.attributes.position.array,o*3);N.set(g.attributes.normal.array,o*3);if(g.attributes.uv)U.set(g.attributes.uv.array,o*2);o+=g.attributes.position.count;}
    const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(P,3));geo.setAttribute('normal',new THREE.BufferAttribute(N,3));geo.setAttribute('uv',new THREE.BufferAttribute(U,2));
    const me=new THREE.Mesh(geo,m);me.name=prefix+'_'+m.name;out.add(me);}
  return out;
}
const crowd=new THREE.Group();let seatN=0;
const ROWS=6, R0=SR+1.6, ROW=.95, PITCH=.58, AISLE=.75;
for(let r=0;r<ROWS;r++){
  const R=R0+r*ROW, n=Math.floor(Math.PI*2*R/PITCH);
  for(let k=0;k<n;k++){
    const a=(k+.5)/n*Math.PI*2;
    let inAisle=false;for(let q4=0;q4<4;q4++){const d=Math.abs(Math.atan2(Math.sin(a-q4*Math.PI/2),Math.cos(a-q4*Math.PI/2)));if(d*R<AISLE)inAisle=true;}
    if(inAisle)continue;
    const id=++seatN,c=new THREE.Group();c.position.set(Math.cos(a)*R,0,Math.sin(a)*R);c.rotation.y=Math.atan2(-Math.cos(a),-Math.sin(a));crowd.add(c);
    chairAt(id,c);
    if(rnd()<.85) seated(id,c,SUITS[Math.floor(rnd()*SUITS.length)],SKIN[Math.floor(rnd()*SKIN.length)]);
  }
}
